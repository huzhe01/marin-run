name: refresh

on:
  schedule:
    # Every 6 hours, off the top of the hour. GitHub may delay scheduled runs.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install markdown

      - name: Collect public telemetry
        env:
          # Authenticates the gh CLI for GitHub API reads (higher rate limit).
          GH_TOKEN: ${{ github.token }}
        run: python collect.py --out data.json

      - name: Build site
        run: python build_site.py --data data.json --out site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # A scheduled workflow in a public repo is disabled after 60 days without
      # repository activity; committing the history row each run keeps it alive
      # and records progress over time. Failure here must not block the deploy.
      - name: Commit history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv
          if git diff --cached --quiet; then
            echo "history unchanged"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
